<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Links</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111827;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    text-align:center;
}

h1{
    margin-bottom:10px;
    font-size:32px;
}

p{
    color:#cbd5e1;
    margin-bottom:35px;
}

.link{
    display:block;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:18px;
    margin:15px 0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.25s;
}

.link:hover{
    background:#1d4ed8;
    transform:translateY(-3px);
}

footer{
    margin-top:35px;
    color:#94a3b8;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<h1>🔗 Meus Links</h1>

<p>Escolha uma opção abaixo.</p>

<a class="link" href="https://google.com" target="_blank">
🌐 Google
</a>

<a class="link" href="https://youtube.com" target="_blank">
▶️ YouTube
</a>

<a class="link" href="https://github.com" target="_blank">
💻 GitHub
</a>

<a class="link" href="https://instagram.com" target="_blank">
📷 Instagram
</a>

<footer>
© 2026
</footer>

</div>

</body>
</html>
